<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trebyarte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #eee;
      background: white;
      z-index: 1000;
    }

    .header-left {
      position: absolute;
      left: 20px;
      display: flex;
      gap: 16px;
    }

    .header-left img {
      width: 20px;
      height: 20px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .header-left img:hover {
      opacity: 1;
    }

 .header-center {
  font-family: 'Indie Flower', cursive; /* 👈 ACÁ */
  font-size: 26px;
  letter-spacing: 1px;
}

    /* ESPACIO PARA CONTENIDO */
    main {
      padding-top: 100px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <a href="https://facebook.com/trebyarte" target="_blank">
      <img src="icons/facebook.svg" alt="Facebook">
    </a>

    <a href="https://instagram.com/trebyarte" target="_blank">
      <img src="icons/instagram.svg" alt="Instagram">
    </a>

    <a href="https://tiktok.com/@trebyarte" target="_blank">
      <img src="icons/tiktok.svg" alt="TikTok">
    </a>

    <a href="mailto:trebyarte@gmail.com">
      <img src="icons/mail.svg" alt="Email">
    </a>
  </div>

  <div class="header-center">
    Trebyarte
  </div>
</header>

<main>
  <!-- Después va el contenido -->
</main>

</body>
</html>
